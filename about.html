<!DOCTYPE html>
<html>
  <head>
    <title>About</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- toggle stays the same -->
    <input type="checkbox" id="dark-toggle" />
    <label for="dark-toggle" class="switch">…</label>

    <div class="page">
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
      </nav>

      <h1>About</h1>
      <p>This page is about me.</p>
    </div>
  </body>
</html>

<script>
  const toggle = document.getElementById("dark-toggle");
  const page = document.getElementById("page");

  // Apply saved theme on load
  const savedTheme = localStorage.getItem("theme");

  if (savedTheme === "dark") {
    page.style.setProperty("--bg-color", "#121212");
    page.style.setProperty("--text-color", "#eaeaea");
    toggle.checked = true;
  }

  if (savedTheme === "light") {
    page.style.setProperty("--bg-color", "#ffffff");
    page.style.setProperty("--text-color", "#222");
    toggle.checked = false;
  }

  // Listen for toggle changes
  toggle.addEventListener("change", () => {
    if (toggle.checked) {
      page.style.setProperty("--bg-color", "#121212");
      page.style.setProperty("--text-color", "#eaeaea");
      localStorage.setItem("theme", "dark");
    } else {
      page.style.setProperty("--bg-color", "#ffffff");
      page.style.setProperty("--text-color", "#222");
      localStorage.setItem("theme", "light");
    }
  });
</script>
